# Worker del tauler veïnal (Cloudflare Workers + D1). Ver README.md.
name = "santcugat-board"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "santcugat-board"
database_id = "72a70f52-caa1-4905-8fe8-8e1c5f7cd276"  # lo imprime `npx wrangler d1 create santcugat-board`

[vars]
ALLOWED_ORIGINS = "https://santcugat.horaverda.es,http://localhost:8003"
SITE_URL = "https://santcugat.horaverda.es"
FROM_NAME = "Tauler veïnal de Sant Cugat"
# URL pública de este worker (la da `npx wrangler deploy`); la usa el cron para los enlaces de los correos.
API_URL = "https://santcugat-board.chatcerdanyola.workers.dev"

[triggers]
crons = ["17 3 * * *"]

# Secretos (npx wrangler secret put NOMBRE):
#   TURNSTILE_SECRET, GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN,
#   GMAIL_FROM, ADMIN_KEY, ADMIN_EMAIL, IP_SALT
